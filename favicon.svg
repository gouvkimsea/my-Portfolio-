<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#e7f26d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e7f26d"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGlow)"/>
  
  <!-- Outer Rim Stroke -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="12" stroke-opacity="0.85"/>
  
  <!-- Inner Ambient Glow Ring -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="#e7f26d" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Code Bracket Brand Symbol [ ] -->
  <text x="256" y="326"
        font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
        font-size="230"
        font-weight="800"
        letter-spacing="4"
        text-anchor="middle"
        fill="url(#textGrad)"
        filter="url(#subtleGlow)">[&thinsp;]</text>

  <!-- Core Pulse Accent Dot -->
  <circle cx="256" cy="256" r="14" fill="#e7f26d" opacity="0.95"/>
  <circle cx="256" cy="256" r="28" fill="#38bdf8" opacity="0.28"/>
</svg>
